name: Despliegue en Docker Hub
on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codigo 
        uses: actions/checkout@v6
      
      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Configurar Docker Build
        uses: docker/setup-buildx-action@v3

      - name: Construir y publicar la imagen a Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/mi-web-plana:latest
            ${{ secrets.DOCKER_USERNAME }}/mi-web-plana:${{ github.sha }}